name: Check scheduled publication

on:
  schedule:
    # Check hourly so approved articles appear after their publication date.
    # Avoid the start of the hour, when scheduled Actions are busiest.
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  # Decision checks can replace each other without touching full publications.
  group: scheduled-publication-check
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  decision:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      deployments: read
    steps:
      - name: Checkout publication decision
        uses: actions/checkout@v7

      - name: Decide whether publication is due
        id: decision
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/scheduled-publication.js decide \
            --event "${{ github.event_name }}" \
            --commit "${{ github.sha }}" \
            --github-output "${GITHUB_OUTPUT}" \
            --summary "${GITHUB_STEP_SUMMARY}"

      - name: Request current publication
        if: ${{ steps.decision.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run hugo.yaml --repo "${GITHUB_REPOSITORY}" --ref master
