name: Build and deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    # Check hourly so approved articles appear after their publication date.
    # Avoid the start of the hour, when scheduled Actions are busiest.
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

defaults:
  run:
    shell: bash

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      deployments: read
    outputs:
      publish: ${{ steps.decision.outputs.publish }}
    steps:
      - name: Checkout publication decision
        uses: actions/checkout@v7

      - name: Decide whether publication is due
        id: decision
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/scheduled-publication.js decide \
            --event "${{ github.event_name }}" \
            --commit "${{ github.sha }}" \
            --github-output "${GITHUB_OUTPUT}" \
            --summary "${GITHUB_STEP_SUMMARY}"

  publication:
    needs: preflight
    if: ${{ needs.preflight.outputs.publish == 'true' }}
    concurrency:
      # The desired published state is the latest commit on the publication branch.
      # Skip-only checks never replace an active or pending full publication.
      group: pages
      cancel-in-progress: true
    uses: ./.github/workflows/publication.yaml
