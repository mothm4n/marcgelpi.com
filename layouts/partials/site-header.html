<header class="site-header">

    <span aria-hidden="true">MG</span>
  </a>

  <nav class="desktop-navigation" aria-label="Primary" data-primary-navigation>
    <ul>
      {{ partial "navigation-items.html" (dict "page" . "menu" site.Menus.main) }}

  </nav>

  <details class="mobile-navigation" data-mobile-navigation>

    <nav aria-label="Mobile">

      </ul>
    </nav>
  </details>
</header>
