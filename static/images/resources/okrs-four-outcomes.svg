<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 560" role="img" aria-labelledby="title description">
  <title id="title">Four outcomes that make the case for OKRs</title>
  <desc id="description">Focus and commitment, alignment and connection, tracking and accountability, and stretch and learning.</desc>
  <rect width="1440" height="560" fill="#f4efe6"/>
  <path d="M0 140h1440M0 280h1440M0 420h1440" stroke="#cfc8bc" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(70 0)">
      <text x="0" y="92" fill="#c96c4d" font-family="Georgia, serif" font-size="54">01</text>
      <text x="125" y="70" fill="#174c5b" font-size="28" font-weight="700">Focus and commitment</text>
      <text x="125" y="105" fill="#252522" font-size="22">Protect capacity for the few priorities that matter now.</text>
    </g>
    <g transform="translate(70 140)">
      <text x="0" y="92" fill="#c96c4d" font-family="Georgia, serif" font-size="54">02</text>
      <text x="125" y="70" fill="#174c5b" font-size="28" font-weight="700">Alignment and connection</text>
      <text x="125" y="105" fill="#252522" font-size="22">Connect visible team goals to shared outcomes.</text>
    </g>
    <g transform="translate(70 280)">
      <text x="0" y="92" fill="#c96c4d" font-family="Georgia, serif" font-size="54">03</text>
      <text x="125" y="70" fill="#174c5b" font-size="28" font-weight="700">Tracking and accountability</text>
      <text x="125" y="105" fill="#252522" font-size="22">Surface drift early enough to learn and adapt.</text>
    </g>
    <g transform="translate(70 420)">
      <text x="0" y="92" fill="#c96c4d" font-family="Georgia, serif" font-size="54">04</text>
      <text x="125" y="70" fill="#174c5b" font-size="28" font-weight="700">Stretch and learning</text>
      <text x="125" y="105" fill="#252522" font-size="22">Make ambitious experiments safe to explore.</text>
    </g>
  </g>
</svg>
